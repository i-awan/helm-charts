{{- if .Values.producer.enabled }}
{{- $kind := .Values.producer.kind }}
{{- if not (has $kind (list "Job" "Deployment")) }}
{{- fail "producer.kind must be Job or Deployment" }}
{{- end }}
{{- if and (eq $kind "Job") (eq (int .Values.producer.messageCount) 0) }}
{{- fail "producer.kind=Job needs producer.messageCount > 0 (use kind: Deployment to produce until stopped)" }}
{{- end }}
{{- $configHash := printf "%s%s" (include (print $.Template.BasePath "/configmap-app.yaml") .) (include (print $.Template.BasePath "/configmap-schema.yaml") .) | sha256sum }}
apiVersion: {{ if eq $kind "Job" }}batch/v1{{ else }}apps/v1{{ end }}
kind: {{ $kind }}
metadata:
  {{- /* A Job's pod template is immutable, so each helm revision gets its own Job. */}}
  name: {{ include "ktc.fullname" . }}-producer{{ if eq $kind "Job" }}-r{{ .Release.Revision }}{{ end }}
  labels:
    {{- include "ktc.labels" . | nindent 4 }}
    app.kubernetes.io/component: producer
spec:
  {{- if eq $kind "Job" }}
  backoffLimit: {{ .Values.producer.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.producer.ttlSecondsAfterFinished }}
  {{- else }}
  replicas: {{ .Values.producer.replicas }}
  selector:
    matchLabels:
      {{- include "ktc.selectorLabels" (dict "root" . "component" "producer") | nindent 6 }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ $configHash }}
      labels:
        {{- include "ktc.selectorLabels" (dict "root" . "component" "producer") | nindent 8 }}
    spec:
      {{- include "ktc.podSpec" (dict "root" . "mode" "produce" "roleEnv" (include "ktc.producerEnv" .) "restartPolicy" (ternary "Never" "Always" (eq $kind "Job")) "resources" .Values.producer.resources) | nindent 6 }}
{{- end }}
