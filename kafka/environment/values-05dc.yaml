# The tiebreaker region. Runs exactly one KRaftController pod, contributing
# one vote to the shared quorum. No Kafka CR is rendered for this region
# (region.mode=light)  - no brokers, no partition data, minimal footprint.

namespace: kafka-region-05dc

region:
  name: region-05dc
  mode: light

# Consistent with region-a/b  - was missing here before this cleanup,
# silently inheriting values.yaml's tls.enabled: true default instead.
tls:
  # Both flags needed together  - see values-region-a.yaml for why.
  # Applies here too, controller-only region or not  - KRaftController
  # has its own TLS listener referencing the same shared cert.
  enabled: true
  # Mutual TLS on the broker/controller listeners - must be true on EVERY
  # region's values file (peers verify each other across regions).
  mtls:
    enabled: true
  certManager:
    enabled: true   # must be true on EVERY region's values file
    # No "kafka." bootstrap service here (mode: light, no brokers) - just
    # the KRaftController's own service name + wildcard.
    dnsNames:
      - kraftcontroller-region-05dc.kafka-region-05dc.svc.cluster.local
      - "*.kafka-region-05dc.svc.cluster.local"
    # Schema Registry and Control Center get their own certificates
    # (own CN/SANs, same issuer). Same value in every region.
    serviceCerts:
      enabled: true
authorization:
  enabled: true
  # Principals are the cert CNs (see tls.mtls.principalMappingRules). Every
  # broker/controller must be a super user on every node, so the list is the
  # same in all three regional files. Schema Registry and C3 are super users
  # here for simplicity; replace with scoped ACLs/RBAC when hardening.
  superUsers:
    - User:region-a
    - User:region-b
    - User:region-05dc
    - User:region-a-schemaregistry
    - User:region-b-schemaregistry
    - User:region-a-controlcenter

# No brokerIdOffset needed  - mode: light renders no Kafka CR.
controllerIdOffset: 300

# Paste the clusterID fetched from region-a here before installing.
cluster:
  clusterID: "NWNkODNlMDMtOGMxMS00Mw"
  replicationFactor: 2   # 1 broker per region x 2 regions; must be identical in every region's file

# Identical to region-a's list  - TEMPORARY internal DNS, see region-a's
# values file for the full explanation.
staticQuorumVoters:
  - brokerEndpoint: kraftcontroller-region-a-0.kraftcontroller-region-a.kafka-region-a.svc.cluster.local:9074
    nodeId: 100
  - brokerEndpoint: kraftcontroller-region-b-0.kraftcontroller-region-b.kafka-region-b.svc.cluster.local:9074
    nodeId: 200
  - brokerEndpoint: kraftcontroller-region-05dc-0.kraftcontroller-region-05dc.kafka-region-05dc.svc.cluster.local:9074
    nodeId: 300

kraftController:
  replicas: 1
  storage:
    class: ""   # use this cluster's default StorageClass  - was hardcoded to "standard" before this cleanup, which may not exist on every cluster
    size: 2Gi
  resources:
    requests:
      cpu: "100m"
      memory: 512Mi
    limits:
      cpu: "500m"
      memory: 1Gi

nodeSelector:
  enabled: false
