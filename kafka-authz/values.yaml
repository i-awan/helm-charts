# ---------------------------------------------------------------------------
# Defaults. Every region overrides at minimum: region.name, region.mode,
# idOffset (controllerIdOffset/brokerIdOffset), and cluster.clusterID
# See environment/values-region-a.yaml / environment/values-region-b.yaml / environment/values-05dc.yaml /
# environment/values-standalone.yaml.
# ---------------------------------------------------------------------------

namespace: confluent

# Set true for a single-cluster test/dev install (see environment/values-standalone.yaml).
# Relaxes the two things that assume multi-cluster infra exists: region node
# labels (nodeSelector) and hard pod anti-affinity (which needs >1 host).
# Leave false for real region deployments.
standalone: false

# Static KRaft quorum voters  - required for genuine cross-namespace/
# cross-cluster quorum formation. Matching `cluster.clusterID` across
# regions is NOT sufficient by itself (confirmed via
# `kafka-metadata-quorum describe --status`: regions never appeared as
# voters OR observers without this). This exact list  - every controller
# across every region  - must be set IDENTICALLY on every region's values
# file, not just pointing at itself. Left empty by default; each
# each environment/values-region-*.yaml overrides it with the full
# list once all region names/namespaces are known (endpoints are
# deterministic from the naming convention, so this can be computed
# upfront  - no need to fetch anything first, unlike clusterID).
staticQuorumVoters: []

# Set false if you (or whoever is installing this) don't have privileges
# to apply node labels (e.g. `oc label node`), or the labels genuinely
# don't exist yet. Independent of `standalone`  - lets you keep real
# multi-broker/multi-region settings (hard anti-affinity, mode: full,
# real replica counts) while skipping only the nodeSelector requirement.
# Skipping this means Kubernetes is free to schedule this region's pods
# onto ANY node, including nodes another region's pods might land on
# (in the mock/single-cluster setup)  - so broker.rack's value stops being
# a reliable description of physical placement. Fine for functional
# testing; not something to leave off for a real production rollout.
nodeSelector:
  enabled: true

# Identity of THIS region. mode "full" runs brokers + a controller.
# mode "light" is the 0.5DC: controller only, no Kafka CR is rendered.
region:
  name: region-a
  mode: full   # full | light

# Settings that must be IDENTICAL across all three region installs  -
# this is what makes them one logical cluster instead of three clusters.
cluster:
  clusterID: ""   # leave blank on first bootstrap install, then fetch and reuse
  name: kafka
  replicationFactor: 3
  minInsyncReplicas: 2

# Lets a region-a consumer that sets client.rack=region-a on its own
# config fetch from a local replica instead of always crossing to
# whichever broker leads the partition. Safe to leave on by default  -
# it's a preference that falls back to normal leader-fetch behavior
# when no local replica exists, and has no effect at all unless the
# consuming application sets client.rack itself.
rackAwareFetching:
  enabled: true

# Every region needs distinct, non-overlapping ID ranges  - and critically,
# controller IDs and broker IDs must never overlap EVEN WITHIN THE SAME
# REGION (Kafka's own startup validation rejects a broker node ID that's
# also a controller quorum voter ID). Convention here: controllers get
# <region-base>, brokers get <region-base + 10>, leaving headroom for a
# handful of controllers before the broker range starts.
#   region-a:    controllers 100-109, brokers 110+
#   region-b:    controllers 200-209, brokers 210+
#   region-05dc: controllers 300-309 (no brokers  - light mode)
# This cannot be changed after the cluster is created  - plan spacing
# generously if you expect to grow broker/controller counts later.
controllerIdOffset: 100
brokerIdOffset: 110

image:
  application: confluentinc/cp-server:7.9.0
  init: confluentinc/confluent-init-container:3.3.0
  controllerApplication: confluentinc/cp-server:7.9.0
  controllerInit: confluentinc/confluent-init-container:3.3.0

kraftController:
  replicas: 1
  storage:
    class: ""
    size: 20Gi
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

kafka:
  replicas: 3
  storage:
    class: ""
    size: 500Gi
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 16Gi
  externalAccess:
    enabled: false
    type: loadBalancer   # loadBalancer | nodePort | route (route = OpenShift-native)
    domain: ""           # used when type: loadBalancer
    nodePort:
      nodePortOffset: 30000   # must be 30000-32767
      host: ""                # k3s VM's real reachable IP/FQDN  - used for every advertised listener
    route:
      domain: ""              # required when type: route  - your OpenShift cluster's apps domain
      bootstrapPrefix: ""     # optional  - defaults exist in CFK if left blank
      brokerPrefix: ""        # optional  - broker DNS becomes <brokerPrefix>0.<domain>, etc.
      wildcardPolicy: ""      # optional

tls:
  enabled: true
  secretRef: kafka-tls   # must be the SAME cert material, pre-created in every region's namespace
                          # see scripts/generate-and-distribute-tls.sh

  # Optional per-service secrets. Blank = fall back to (a) the cert-manager
  # per-service cert if tls.certManager.serviceCerts.enabled, else (b) the
  # shared tls.secretRef above. Use these to point a service at a secret you
  # manage yourself (e.g. one issued by an external CA).
  schemaRegistry:
    secretRef: ""
  controlCenter:
    secretRef: ""

  # Alternative to the manual script above: let cert-manager issue and
  # auto-renew certs, backed by a SHARED root CA  - a plain per-region
  # SelfSigned Issuer does NOT work here: it holds no persistent
  # identity, so each region would get its own unrelated CA and
  # brokers/controllers in different regions would never trust each
  # other's certs (verified: this is a structural property of the
  # SelfSigned issuer type, not a config mistake to tune around).
  #
  # The pattern used instead  - two tiers, same "generate once, propagate
  # everywhere" shape as clusterID:
  #   1. ONE root CA, bootstrapped once, in the region marked
  #      bootstrapRoot: true below (cert-manager-root-ca.yaml)
  #   2. That root Secret copied into every OTHER region's namespace by
  #      a CronJob (cert-manager-ca-distributor.yaml)
  #   3. Every region  - including the root region  - runs its own local
  #      `ca`-type Issuer against that (now-local) root Secret, and
  #      requests its own leaf certificate from it (cert-manager-tls.yaml)
  #
  # cert-manager's native Secret keys (tls.crt/tls.key/ca.crt) are used
  # as-is; there is no key-translation job.
  certManager:
    enabled: false
    bootstrapRoot: false   # true on EXACTLY ONE region's values file  - see environment/values-region-a.yaml
    rootSecretName: kafka-root-ca        # identical across every region's values file
    rootNamespace: kafka-region-a        # the namespace bootstrapRoot:true is set in
    # MUST be overridden in EVERY region's values file — this base
    # default is deliberately empty, not region-a's DNS, since that
    # would otherwise silently apply to region-b/05dc too (a real bug
    # caught during setup: all three regions were about to request
    # certs valid only for region-a's hostname). See
    # environment/values-region-a/b.yaml and environment/values-05dc.yaml for each region's
    # actual override.
    dnsNames: []

    # Give Schema Registry and Control Center their OWN certificates
    # (own key, own CN, own SANs), signed by the same kafka-tls-issuer so
    # every truststore is unchanged. Off = they share tls.secretRef with the
    # brokers, exactly as before.
    # NOTE: each service then presents its own CN as its mTLS/ACL principal
    # (default "<region>-schemaregistry" / "<region>-controlcenter"). With
    # authorization.enabled you must grant those principals access (or map
    # them via ssl.principal.mapping.rules) - they are no longer "User:kafka".
    serviceCerts:
      enabled: false
      schemaRegistry:
        secretName: kafka-schemaregistry-tls
        commonName: ""          # blank = <region.name>-schemaregistry
        extraDnsNames: []       # e.g. an OpenShift Route host
      controlCenter:
        secretName: kafka-controlcenter-tls
        commonName: ""          # blank = <region.name>-controlcenter
        extraDnsNames: []       # e.g. the Route host users browse to

    distributor:
      schedule: "*/10 * * * *"   # non-root regions only  - how often to re-pull the root CA (picks up rotation)
      image: rancher/kubectl:v1.29.0

    # Opt-in, off by default. A distinct client identity (its own
    # commonName, its own cert/key) issued off the SAME shared CA as
    # every broker/controller  - see templates/cert-manager-test-client.yaml.
    # Only for testing external mTLS by hand; a real external client
    # should get its own Certificate resource following this same
    # pattern with its own name, not reuse this one.
    testClient:
      enabled: false
      commonName: test-client
      secretName: kafka-test-client-tls

  # Mutual TLS  - requires the connecting side to also present a valid
  # cert, not just the accepting side. Since every broker/controller
  # both accepts AND initiates connections to its peers, the SAME
  # cert (from tls.secretRef above) serves both roles  - no separate
  # "client cert" needed for internal traffic. This only changes
  # whether the listener DEMANDS a peer cert; requires the shared-CA
  # pattern above so every peer's cert is actually verifiable.
  mtls:
    enabled: false
    # Turns a client cert's DN into the Kafka principal (User:<CN>). cert-manager
    # certs here carry only a CN, so CN=region-a becomes User:region-a. Anything
    # that does not match falls through to DEFAULT (the full DN).
    principalMappingRules: "RULE:^CN=([^,]+).*$/$1/,DEFAULT"

# OAUTHBEARER (OIDC, e.g. Keycloak) SASL auth, layered on top of the TLS
# transport above - TLS still provides encryption/hostname verification;
# this adds a token-based identity on top of it, and is independent of
# tls.mtls (you can run OAuth with or without also demanding a client
# cert). Off by default.
#
# Two distinct roles, both needed on every broker/controller, because each
# one both ACCEPTS connections (as a server, validating the caller's
# token) and INITIATES them to its peers (as a client, fetching its own
# token to present) - inter-broker traffic and controller quorum traffic
# both cross this same boundary:
#   - SERVER side: listener.name.<X>.oauthbearer.sasl.server.callback.handler.class
#     validates tokens presented TO this node.
#   - CLIENT side: listener.name.<X>.oauthbearer.sasl.login.callback.handler.class
#     + sasl.jaas.config + token.endpoint.url, used when this node fetches
#     its OWN token to initiate a connection outward. Easy to forget since
#     only the server side is needed for a pure "accept connections" test -
#     but inter-broker/controller-quorum traffic needs this too, since
#     every node is also a client of its peers.
oauth:
  enabled: false
  # Must match a real listener name on the Kafka CR (kafka.yaml) - this
  # chart's internal listener is named "internal".
  listenerName: internal
  # Must match the KRaftController CR's listener name (kraftcontroller.yaml
  # names its only listener "controller") - the Raft quorum listener is
  # NOT the same listener as kafka.yaml's "internal", so it needs its own
  # copy of these settings.
  controllerListenerName: controller
  tokenEndpointUrl: ""     # e.g. https://<keycloak-host>/realms/<realm>/protocol/openid-connect/token
  clientId: kafka-broker
  # Name of a Secret, pre-created OUTSIDE this chart (do not put a real
  # secret in a committed values file), holding this broker's own
  # service-account client secret. CFK mounts it via spec.mountedSecrets,
  # which - like any Kubernetes Secret volume mount - lands as a
  # DIRECTORY at /mnt/secrets/<name>, one plain file per key, not a
  # single Java properties file. The templates register and read it with
  # Kafka's DirectoryConfigProvider accordingly
  # (${directory:/mnt/secrets/<name>:<key>}), NOT FileConfigProvider/
  # ${file:...} - that mismatch is what produced the generic
  # "LoginException: An internal error occurred while retrieving token
  # from callback handler" the first time this was wired up: the
  # placeholder never resolved, so the literal string was sent to
  # Keycloak as the client secret. The real secret value is never
  # written into the CR or this values file either way.
  clientSecretRef: ""
  clientSecretKey: secret
  serverLoginCallbackHandlerClass: io.confluent.kafka.server.plugins.auth.token.TokenBearerServerLoginCallbackHandler
  clientLoginCallbackHandlerClass: org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler

# Simple ACL authorization (KRaft-compatible). This is the documented,
# stable authorization path for KRaft-based CFK clusters. Full RBAC+MDS
# in KRaft mode exists but is more version-sensitive across CFK releases
#  - check current Confluent docs before switching to it.
authorization:
  enabled: true
  superUsers:
    - User:kafka   # the broker's own inter-broker principal  - must stay a super user

allRegions:
  - region-a
  - region-b
  - region-05dc

# Every schemas/**/*.yaml file (your existing name/subjects/format/schema
# layout) gets rendered into a ConfigMap + Schema CR pair automatically  -
# see templates/schemas.yaml. Requires a running SchemaRegistry CR already
# named per schemaRegistry.clusterRefName below; this chart doesn't deploy
# Schema Registry itself.
schemas:
  enabled: true

# Topics are created from one YAML file each in topics/ (see
# templates/topics.yaml), as CFK KafkaTopic resources against the Kafka CR
# named cluster.name. Only rendered where region.mode is "full". Set
# enabled: false in all but ONE region's values file so the same topic is
# not managed from two namespaces.
topics:
  enabled: true
  # Optional. Needed when the Kafka listener requires TLS/auth for the
  # CFK topic controller, e.g. { name: default } pointing at a KafkaRestClass.
  kafkaRestClassRef: {}

schemaRegistry:
  enabled: true
  clusterRefName: schemaregistry   # must match metadata.name below
  replicas: 1
  image:
    application: confluentinc/cp-schema-registry:7.9.0
    init: confluentinc/confluent-init-container:3.3.0
  # Internal Kafka listener this Schema Registry instance connects to.
  # DO NOT trust this default  - verify against your actual cluster first:
  #   kubectl get svc -n confluent
  #   kubectl get kafka <name> -n confluent -o yaml | grep -A15 listeners
  # A wrong hostname/port here causes a DNS-resolution crash loop on
  # Schema Registry startup (KafkaException: Failed to create new
  # KafkaAdminClient)  - it fails fast rather than falling back to
  # anything, so this value must be exactly right.
  kafkaBootstrapEndpoint: kafka.confluent.svc.cluster.local:9092
  # Init container that blocks until Kafka's listener is reachable before
  # the real schemaregistry container starts  - avoids a noisy crash-loop
  # while Kafka is still coming up (see templates/schemaregistry.yaml).
  waitForKafka:
    enabled: true
    image: busybox:1.36
  resources:
    requests:
      cpu: "250m"
      memory: 512Mi
    limits:
      cpu: "500m"
      memory: 1Gi

# Control Center: optional, single-instance, ONE region only  - it's a
# monitoring/management UI for the whole logical cluster, not a
# per-region component, so it never needs to exist in more than one
# place. Off by default here; the region designated to host it (region-a
# in this chart's convention, same as the TLS bootstrapRoot) sets
# controlCenter.enabled: true in its own values file - never flip this
# on here or in more than one region's file, or you'll get two CC
# instances both claiming to manage the same cluster.
controlCenter:
  enabled: false
  clusterRefName: controlcenter   # must match metadata.name in templates/controlcenter.yaml
  replicas: 1
  image:
    application: confluentinc/cp-enterprise-control-center:7.9.0
    init: confluentinc/confluent-init-container:3.3.0
  dataVolumeCapacity: 10Gi
  resources:
    requests:
      cpu: "500m"
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 4Gi
