apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  annotations:
    platform.confluent.io/broker-id-offset: "100"
spec:
  replicas: 1
  authorization:
    type: simple
    superUsers:
      - User:kafka
  image:
    application: confluentinc/cp-server:7.9.0
    init: confluentinc/confluent-init-container:3.3.0
  dataVolumeCapacity: 20Gi
  # TLS configuration for the KRaft controller
  tls:
    secretRef: kraftcontroller-tls
  podTemplate:
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: kraftcontroller
              topologyKey: kubernetes.io/hostname
  configOverrides:
    server:
      - listener.name.controller.ssl.client.auth=required
      - authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
      - confluent.authorizer.access.rule.providers=KRAFT_ACL
      - super.users=User:kafka
  listeners:
    controller:
      tls:
        enabled: true
        secretRef: kraftcontroller-tls
