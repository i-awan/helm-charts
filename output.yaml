# Source: kafka-2.5dc/templates/schemaregistry.yaml
apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaeregistry
  namespace: kafka-region-a
spec:
  replicas: 1
  image:
    application: confluentinc/cp-schema-registry:7.9.0
    init: confluentinc/confluent-init-container:3.3.0
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.kafka-region-a.svc.cluster.local:9092
      tls:
        enabled: true
        secretRef: kafka-tls
  podTemplate:
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
    initContainers:
      # Blocks with a clean, expected "waiting for..." log line until
      # Kafka's listener is actually reachable, instead of letting the
      # main schemaregistry container crash-loop with a Java stack trace
      # while Kafka is still coming up. Purely a UX/log-cleanliness fix  -
      # Schema Registry would eventually succeed via its own retries
      # either way; this just makes the wait visible and quiet.
      - name: wait-for-kafka
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            until nc -z -w2 kafka.kafka-region-a.svc.cluster.local 9092; do
              echo "waiting for kafka at kafka.kafka-region-a.svc.cluster.local:9092..."
              sleep 5
            done
            echo "kafka is reachable, continuing"
  tls:
    secretRef: schemaregistry-tls
  listeners:
    internal:
      tls:
        enabled: true
        secretRef: schemaregistry-tls

