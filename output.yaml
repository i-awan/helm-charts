# Source: kafka-2.5dc/templates/cert-manager-root-ca.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kafka-root-ca
  namespace: kafka-region-a
spec:
  isCA: true
  secretName: kafka-root-ca
  commonName: kafka-2-5dc-root-ca
  issuerRef:
    name: kafka-root-bootstrap
    kind: Issuer
  # Long-lived  - this is the shared trust anchor for the whole cluster;
  # rotating it means re-trusting every region, not something to do
  # casually or often.
  duration: 87600h    # 10 years
  renewBefore: 720h    # 30 days
---
# Source: kafka-2.5dc/templates/cert-manager-tls.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kafka-tls-cert
spec:
  # Same name as tls.secretRef  - nothing else in this chart needs to
  # change. The translator CronJob below adds CFK's expected key names
  # onto this SAME secret rather than creating a second one.
  secretName: "kafka-tls"
  # Matches the namespace this cert lives in (region-a/region-b/
  # region-05dc = the actual namespace name in every values file).
  # Not used by Kafka's own TLS handshake  - SANs (dnsNames, below) are
  # what that actually validates  - but org admission policies (e.g. a
  # Kyverno rule tying a namespace's label to an allowed CN) may check
  # this specifically as an identity-governance control, independent of
  # anything Kafka itself cares about.
  commonName: "region-a"
  issuerRef:
    name: kafka-tls-issuer
    kind: Issuer
  commonName: kafka.kafka-region-a.svc.cluster.local 
  dnsNames:
    - "kafka.kafka-region-a.svc.cluster.local"
    - "kafka-0.kafka.kafka-region-a.svc.cluster.local"
    - "kafka-1.kafka.kafka-region-a.svc.cluster.local"
    - "kafka-2.kafka.kafka-region-a.svc.cluster.local"
    - "*.kafka-region-a.svc.cluster.local"
---
