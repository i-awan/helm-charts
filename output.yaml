# Source: kafka-2.5dc/templates/cert-manager-tls.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kafka-tls-translator
spec:
  schedule: "*/10 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: kafka-tls-translator
          restartPolicy: OnFailure
          containers:
            - name: translator
              image: alpine/k8s:1.29.15
              command:
                - sh
                - -c
                - |
                  set -eu

                  NS="kafka-region-a"

                  # cert-manager source Secrets
                  SECRET_KAFKA="kafka-tls"
                  SECRET_C3=controlcenter-tls

                  #
                  # ---------------------------------------------------------
                  # Kafka certificate
                  # ---------------------------------------------------------
                  #

                  TLS_CRT_KAFKA=$(kubectl get secret "$SECRET_KAFKA" \
                    -n "$NS" \
                    -o jsonpath='{.data.tls\.crt}')

                  TLS_KEY_KAFKA=$(kubectl get secret "$SECRET_KAFKA" \
                    -n "$NS" \
                    -o jsonpath='{.data.tls\.key}')

                  CA_CRT_KAFKA=$(kubectl get secret "$SECRET_KAFKA" \
                    -n "$NS" \
                    -o jsonpath='{.data.ca\.crt}')

                  kubectl patch secret "$SECRET_KAFKA" \
                    -n "$NS" \
                    --type=merge \
                    -p \
                    "{\"data\":{
                      \"fullchain.pem\":\"$TLS_CRT_KAFKA\",
                      \"privkey.pem\":\"$TLS_KEY_KAFKA\",
                      \"cacerts.pem\":\"$CA_CRT_KAFKA\"
                    }}"

                  echo "Translated $SECRET_KAFKA:"
                  echo "  tls.crt -> fullchain.pem"
                  echo "  tls.key -> privkey.pem"
                  echo "  ca.crt  -> cacerts.pem"

                  #
                  # ---------------------------------------------------------
                  # Control Center certificate
                  # ---------------------------------------------------------
                  #

                  TLS_CRT_C3=$(kubectl get secret "$SECRET_C3" \
                    -n "$NS" \
                    -o jsonpath='{.data.tls\.crt}')

                  TLS_KEY_C3=$(kubectl get secret "$SECRET_C3" \
                    -n "$NS" \
                    -o jsonpath='{.data.tls\.key}')

                  CA_CRT_C3=$(kubectl get secret "$SECRET_C3" \
                    -n "$NS" \
                    -o jsonpath='{.data.ca\.crt}')

                  kubectl patch secret "$SECRET_C3" \
                    -n "$NS" \
                    --type=merge \
                    -p \
                    "{\"data\":{
                      \"fullchain.pem\":\"$TLS_CRT_C3\",
                      \"privkey.pem\":\"$TLS_KEY_C3\",
                      \"cacerts.pem\":\"$CA_CRT_C3\"
                    }}"

                  echo "Translated $SECRET_C3:"
                  echo "  tls.crt -> fullchain.pem"
                  echo "  tls.key -> privkey.pem"
                  echo "  ca.crt  -> cacerts.pem"

                  echo "TLS translation completed successfully."

                  #
                  # ---------------------------------------------------------
                  #  KRaft Controller certificate
                  # ---------------------------------------------------------
                  #
                  SECRET_KRAFT=kraftcontroller-tls

                  TLS_CRT_KRAFT=$(kubectl get secret "$SECRET_KRAFT" \
                    -n "$NS" \
                    -o jsonpath='{.data.tls\.crt}')

                  TLS_KEY_KRAFT=$(kubectl get secret "$SECRET_KRAFT" \
                    -n "$NS" \
                    -o jsonpath='{.data.tls\.key}')

                  CA_CRT_KRAFT=$(kubectl get secret "$SECRET_KRAFT" \
                    -n "$NS" \
                    -o jsonpath='{.data.ca\.crt}')

                  kubectl patch secret "$SECRET_KRAFT" \
                    -n "$NS" \
                    --type=merge \
                    -p \
                    "{\"data\":{
                      \"fullchain.pem\":\"$TLS_CRT_KRAFT\",
                      \"privkey.pem\":\"$TLS_KEY_KRAFT\",
                      \"cacerts.pem\":\"$CA_CRT_KRAFT\"
                    }}"

                    echo "Translated $SECRET_KRAFT:"
                    echo "  tls.crt -> fullchain.pem"
                    echo "  tls.key -> privkey.pem"
                    echo "  ca.crt  -> cacerts.pem"
                    
                    # ---------------------------------------------------------
                    # Schema Registry certificate
                    # ---------------------------------------------------------

                    SECRET_SR=schemaregistry-tls

                    TLS_CRT_SR=$(kubectl get secret "$SECRET_SR" \
                      -n "$NS" \
                      -o jsonpath='{.data.tls\.crt}')

                    TLS_KEY_SR=$(kubectl get secret "$SECRET_SR" \
                      -n "$NS" \
                      -o jsonpath='{.data.tls\.key}')

                    CA_CRT_SR=$(kubectl get secret "$SECRET_SR" \
                      -n "$NS" \
                      -o jsonpath='{.data.ca\.crt}')

                    kubectl patch secret "$SECRET_SR" \
                      -n "$NS" \
                      --type=merge \
                      -p \
                      "{\"data\":{
                        \"fullchain.pem\":\"$TLS_CRT_SR\",
                        \"privkey.pem\":\"$TLS_KEY_SR\",
                        \"cacerts.pem\":\"$CA_CRT_SR\"
                      }}"

                    echo "Translated $SECRET_SR:"
                    echo "  tls.crt -> fullchain.pem"
                    echo "  tls.key -> privkey.pem"
                    echo "  ca.crt  -> cacerts.pem"
