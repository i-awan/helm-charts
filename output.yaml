# Source: kafka-2.5dc/templates/cert-manager-root-ca.yaml
# The ONLY SelfSigned issuer in the whole pattern  - used exactly once,
# to bootstrap a real, reusable root CA. Every other region's Issuer is
# type `ca`, referencing the Secret this produces (copied in by
# cert-manager-ca-distributor.yaml), never SelfSigned again.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: kafka-root-bootstrap
  namespace: kafka-region-a
spec:
  selfSigned: {}
---
# Source: kafka-2.5dc/templates/cert-manager-tls.yaml
# `ca`-type Issuer, referencing the shared root CA Secret  - LOCAL to
# this namespace either way: bootstrapped directly here if this is the
# root region (cert-manager-root-ca.yaml), or copied in by the
# distributor CronJob if not (cert-manager-ca-distributor.yaml). Never
# `selfSigned` here  - that's what breaks cross-region trust; see the
# comment on tls.certManager in values.yaml for the full reasoning.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: kafka-tls-issuer
spec:
  ca:
    secretName: "kafka-root-ca"
