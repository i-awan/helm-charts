{{- if .Values.kafkaRestProxy.enabled }}
apiVersion: platform.confluent.io/v1beta1
kind: KafkaRestProxy
metadata:
  name: {{ .Values.kafkaRestProxy.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.kafkaRestProxy.replicas }}
  image:
    application: {{ .Values.images.kafkaRest }}
    init: {{ .Values.images.init }}
  {{- if .Values.tls.enabled }}
  tls:
    autoGeneratedCerts: {{ .Values.tls.autoGeneratedCerts }}
  {{- end }}
  dependencies:
    kafka:
      bootstrapEndpoint: {{ .Values.kafka.bootstrapEndpoint }}
      {{- if .Values.tls.enabled }}
      tls:
        enabled: true
      {{- end }}
      {{- if .Values.kafkaRestProxy.kafkaAuth.enabled }}
      authentication:
        type: {{ .Values.kafkaRestProxy.kafkaAuth.type }}
        jaasConfig:
          secretRef: {{ .Values.kafkaRestProxy.kafkaAuth.secretRef }}
      {{- end }}
{{- end }}