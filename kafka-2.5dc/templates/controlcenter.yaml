{{- if .Values.controlCenter.enabled  }}
apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
spec:
  replicas: 1
  image:
    application: confluentinc/cp-enterprise-control-center:7.9.0
    init: confluentinc/confluent-init-container:3.3.0
  dataVolumeCapacity: 2Gi
  tls:
    enabled: true
    secretRef: controlcenter-tls
  dependencies:
    kafka:
      bootstrapEndpoint: {{ .Values.kafka.kafkaBootstrapEndpoint }}
      {{- if .Values.tls.enabled }}
      tls:
        enabled: true
        secretRef: {{ .Values.tls.secretRef }}
      {{- end }}
      {{- if .Values.tls.mtls.enabled }}
      authentication:
        type: mtls
      {{- end }}
  configOverrides:
    server:
      - confluent.controlcenter.rest.listeners=https://0.0.0.0:9021
{{ end }}