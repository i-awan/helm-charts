apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
spec:
  replicas: 1
  image:
    application: confluentinc/cp-enterprise-control-center:8.1.0
    init: confluentinc/confluent-init-container:3.1.0
  dataVolumeCapacity: 2Gi
  tls:
    secretRef: controlcenter-tls
  configOverrides:
    server:
      - confluent.controlcenter.rest.listeners=https://0.0.0.0:9021