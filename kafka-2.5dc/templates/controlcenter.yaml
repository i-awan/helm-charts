{{- if .Values.controlCenter.enabled }}
apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: {{ .Values.controlCenter.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.controlCenter.replicas }}
  image:
    application: {{ .Values.images.controlCenter }}
    init: {{ .Values.images.init }}
  dataVolumeCapacity: {{ .Values.controlCenter.dataVolumeCapacity }}
  {{- if .Values.tls.enabled }}
  tls:
    autoGeneratedCerts: {{ .Values.tls.autoGeneratedCerts }}
  {{- end }}
  dependencies:
    kafka:
      bootstrapEndpoint: {{ .Values.kafka.bootstrapEndpoint }}
      {{- if .Values.tls.enabled }}
      tls:
        enabled: true
      {{- end }}
    connect:
      - name: {{ .Values.connect.name }}
        url: {{ .Values.controlCenter.connectUrl }}
    {{- if .Values.controlCenter.schemaRegistry.enabled }}
    schemaRegistry:
      url: {{ .Values.controlCenter.schemaRegistry.url }}
    {{- end }}
{{- end }}