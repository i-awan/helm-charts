{{- if .Values.kafkaRestProxy.enabled  }}
apiVersion: platform.confluent.io/v1beta1
kind: KafkaRestProxy
metadata:
  name: kafkarest
spec:
  replicas: 1
  image:
    application: confluentinc/cp-kafka-rest:8.2.2
    init: confluentinc/confluent-init-container:2.10.1
  tls:
    enabled: true
    secretRef: kafka-rest-tls

  authorization:
    type: rbac
    
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.kafka-region-a.svc.cluster.local:9071
      authentication:
        type: mtls
      tls:
        enabled: true
        secretRef: kafka-rest-tls

    mds:
      endpoint: https://kafka-mds.kafka-region-a.svc.cluster.local:8090
      authentication:
        type: mtls
      tls:
        enabled: true
        secretRef: kafka-mds-tls
        jksPassword:
          secretRef: kafka-mds-jks-password
      tokenKeyPair:
        secretRef: mds-token
      ssoProtocol: oidc
{{ end }}