apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-test-client-config
  namespace: kafka-region-a
data:
  client.properties: |
    security.protocol=SSL
    ssl.truststore.type=PEM
    ssl.truststore.location=/mnt/kafka-tls/ca.crt
    ssl.keystore.type=PEM
    ssl.keystore.location=/tmp/keystore.pem
---
apiVersion: v1
kind: Pod
metadata:
  name: kafka-test-client
  namespace: kafka-region-a
spec:
  restartPolicy: Never
  containers:
    - name: kafka-test-client
      image: confluentinc/cp-schema-registry:7.9.0
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: client-tls
          mountPath: /mnt/kafka-tls
          readOnly: true
        - name: client-config
          mountPath: /mnt/config
          readOnly: true
        - name: scratch
          mountPath: /tmp
  volumes:
    - name: client-tls
      secret:
        secretName: kafka-test-client-tls
    - name: client-config
      configMap:
        name: kafka-test-client-config
    - name: scratch
      emptyDir: {}
