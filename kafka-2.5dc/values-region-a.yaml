
# region-b  - full region (brokers + controller). Install AFTER region-a,
# once you've fetched its clusterID and pasted it below.

namespace: kafka-region-a

cluster:
  clusterID: ""   # leave blank on first bootstrap install, then fetch and reuse
  replicationFactor: 2
  minInsyncReplicas: 2

region:
  name: region-a
  mode: full

  
controllerIdOffset: 100
brokerIdOffset: 110

# Paste the clusterID fetched from region-a here before installing.
cluster:
  clusterID: ""

